<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion Drift Creator Station</title>
    <link rel="icon" type="image/png" href="assets/ODCS.png" />
    <link rel="apple-touch-icon" href="assets/ODCS.png" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Cursor, Background, Navbar -->
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="grid"></div>
    </div>

    <header class="navbar">
        <div class="pill">
            <div id="navbarProfile"></div>
            <nav>
                <a href="index.html">Home</a>
                <a href="browse.html">Browse</a>
                <a href="upload.html" class="active">Contact</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <!-- Hero + Form -->
    <main class="hero">
        <div class="hero-content">
            <div class="eyebrow"><span></span>Orion Drift Creator Station</div>
            <h1>Request an Asset</h1>
            <p>
                This is for requesting assets only. If you need support, please contact the Modmail bot in our Discord server.<br><br>
                Fill out the form below to request an asset. Once submitted, a ticket will be created and we will respond shortly!
            </p>

            <div class="form-container">
                <form id="discordForm">
                    <div class="form-group">
                        <label for="reason">Asset Description</label>
                        <textarea id="reason" placeholder="Describe the asset you want..&#10;e.g. Circuit Lounge model, Drifter model, etc." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="uploadLink">Upload Link <span class="optional">(optional - if you are supplying the asset)</span></label>
                        <input type="url" id="uploadLink" placeholder="https://example.com/my-asset.zip" />
                    </div>
                    <button type="submit" class="submit-button" id="submitBtn">Submit Request</button>
                </form>
                <div id="formStatus"></div>
            </div>
        </div>
    </main>

    <script>
        // ── Custom Cursor ──
        (function initCursor() {
            const ring = document.getElementById('cursorRing');
            let mx = 0, my = 0;
            let rx = 0, ry = 0;
            let hover = false;

            document.addEventListener('mousemove', e => {
                mx = e.clientX;
                my = e.clientY;
                const target = e.target;
                hover = !!target.closest('a, button, .pill, .primary-button, .submit-button, .login-nav-btn, .profile-container');
                if (hover) {
                    ring.style.width = '40px';
                    ring.style.height = '40px';
                    ring.style.border = '2px solid rgba(255,255,255,0.4)';
                    ring.style.background = 'rgba(255,255,255,0.08)';
                    ring.style.backdropFilter = 'blur(2px)';
                    ring.style.mixBlendMode = 'normal';
                } else {
                    ring.style.width = '24px';
                    ring.style.height = '24px';
                    ring.style.border = 'none';
                    ring.style.background = 'white';
                    ring.style.backdropFilter = 'none';
                    ring.style.mixBlendMode = 'difference';
                }
                document.body.style.cursor = 'none';
            });

            function anim() {
                rx += (mx - rx) * 0.18;
                ry += (my - ry) * 0.18;
                ring.style.left = (rx - ring.offsetWidth / 2) + 'px';
                ring.style.top = (ry - ring.offsetHeight / 2) + 'px';
                requestAnimationFrame(anim);
            }

            document.documentElement.style.cursor = 'none';
            document.body.style.cursor = 'none';
            const style = document.createElement('style');
            style.textContent = `
                *,
                *::before,
                *::after {
                    cursor: none !important;
                }
            `;
            document.head.appendChild(style);

            document.addEventListener('mouseleave', () => { ring.style.opacity = '0'; });
            document.addEventListener('mouseenter', () => { ring.style.opacity = '1'; });

            anim();
        })();

        // ── Profile ──
        (function initProfile() {
            const AUTH_BACKEND_URL = window.location.origin;
            const container = document.getElementById('navbarProfile');

            function render() {
                const user = JSON.parse(localStorage.getItem('discordUser'));
                if (user) {
                    const avatar = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64` : `https://cdn.discordapp.com/embed/avatars/${Number(user.id) % 5}.png`;
                    container.innerHTML = `
                        <div class="profile-container" id="profileDropdown">
                            <img src="${avatar}" alt="Avatar" />
                            <span class="username">${user.username}</span>
                            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M6 8L1 3L11 3L6 8Z" fill="white"/></svg>
                            <div class="dropdown-menu" id="dropdownMenu">
                                <a href="#" class="logout-item" onclick="logout()">Logout</a>
                            </div>
                        </div>
                    `;
                    const dd = document.getElementById('profileDropdown');
                    const menu = document.getElementById('dropdownMenu');
                    dd.addEventListener('click', e => {
                        e.stopPropagation();
                        dd.classList.toggle('open');
                        menu.classList.toggle('show');
                    });
                    document.addEventListener('click', () => {
                        dd.classList.remove('open');
                        menu.classList.remove('show');
                    });
                    document.getElementById('submitBtn').disabled = false;
                    const status = document.getElementById('formStatus');
                    if (status.textContent.includes('login')) { status.style.display = 'none'; }
                } else {
                    container.innerHTML = `
                        <a href="${AUTH_BACKEND_URL}/api/login?return_to=${encodeURIComponent(window.location.pathname)}" class="login-nav-btn">
                            <svg width="16" height="16" viewBox="0 0 28 28"><path d="M23.5 9.5C23.5 8.11929 22.3807 7 21 7H7C5.61929 7 4.5 8.11929 4.5 9.5V18.5C4.5 19.8807 5.61929 21 7 21H21C22.3807 21 23.5 19.8807 23.5 18.5V9.5Z" stroke="white" stroke-width="2"/><path d="M4.5 9L14 15.5L23.5 9" stroke="white" stroke-width="2"/></svg>
                            Login
                        </a>
                    `;
                    document.getElementById('submitBtn').disabled = true;
                    const status = document.getElementById('formStatus');
                    status.textContent = 'Please login with Discord to submit a request.';
                    status.className = 'error';
                    status.style.display = 'block';
                }
            }

            window.logout = function() {
                localStorage.removeItem('discordUser');
                window.location.href = window.location.pathname;
            };

            (function handleRedirect() {
                const params = new URLSearchParams(window.location.search);
                const username = params.get('username');
                const id = params.get('id');
                const avatar = params.get('avatar');
                if (username && id) {
                    localStorage.setItem('discordUser', JSON.stringify({ username, id, avatar }));
                    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
                }
            })();

            render();
        })();

        // ── Form Submission ──
        (function initForm() {
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1544377650427076688/h3zKCeyJThKUJy-qPeyMuJZ7V2qw8khyaav4dEugK9CPRN_AcQ-bIAgB3P-D3gu2VNa_';
            const form = document.getElementById('discordForm');
            const statusDiv = document.getElementById('formStatus');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async e => {
                e.preventDefault();

                const user = JSON.parse(localStorage.getItem('discordUser'));
                if (!user) {
                    showStatus('Please login with Discord first.', 'error');
                    return;
                }

                const reason = document.getElementById('reason').value.trim();
                const uploadLink = document.getElementById('uploadLink').value.trim();

                if (!reason) {
                    showStatus('Please describe the asset you need.', 'error');
                    return;
                }

                const threadName = `${user.username} (${user.id})`.slice(0, 100);
                const embed = {
                    color: 0x5865F2,
                    author: {
                        name: user.username,
                        icon_url: user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : `https://cdn.discordapp.com/embed/avatars/${Number(user.id) % 5}.png`
                    },
                    description: `**Asset Request:**\n${reason}`,
                    fields: [
                        { name: 'Upload Link', value: uploadLink || 'None provided', inline: false },
                        { name: 'Date Submitted', value: new Date().toLocaleString('en-US', { timeZone: 'EST' }), inline: false }
                    ],
                    footer: { text: 'User ID: ' + user.id },
                    timestamp: new Date().toISOString()
                };

                const payload = {
                    thread_name: threadName,
                    content: `<@${user.id}> submitted a new asset request!`,
                    embeds: [embed]
                };

                submitBtn.disabled = true;
                showStatus('Submitting request...', 'loading');

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        showStatus('Request submitted! Check your tickets in Discord.', 'success');
                        form.reset();
                    } else {
                        const errorText = await response.text();
                        showStatus(`Discord error: ${errorText}`, 'error');
                    }
                } catch (error) {
                    showStatus(`Network error: ${error.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                }
            });

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = type;
                statusDiv.style.display = 'block';
                if (type === 'success') {
                    setTimeout(() => { statusDiv.style.display = 'none'; }, 10000);
                }
            }
        })();
    </script>
</body>
</html>
